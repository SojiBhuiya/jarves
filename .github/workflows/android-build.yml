name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Prepare release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.JARVES_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JARVES_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JARVES_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JARVES_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > jarves-release.jks
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured. Skipping release APK."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          JARVES_KEYSTORE_PASSWORD: ${{ secrets.JARVES_KEYSTORE_PASSWORD }}
          JARVES_KEY_ALIAS: ${{ secrets.JARVES_KEY_ALIAS }}
          JARVES_KEY_PASSWORD: ${{ secrets.JARVES_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarves-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jarves-release-apk
          path: app/build/outputs/apk/release/app-release.apk

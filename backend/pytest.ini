[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    -ra
filterwarnings =
    # FastAPI's TestClient deprecation notice is about a future httpx2 switch,
    # not about anything Aladin controls. Keep the signal-to-noise ratio high
    # so a real warning is not lost in a wall of framework noise.
    ignore::DeprecationWarning:starlette.*
    ignore::UserWarning
